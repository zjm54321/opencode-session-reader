name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install modern npm tooling supporting OIDC Trusted Publishing
        run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must match v${version} in package.json`);
          }
          NODE
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run unit tests
        run: bun test
      - name: Build bundle
        run: bun run build
      - name: Dry-run pack verification
        run: npm pack --dry-run --ignore-scripts
      - name: Publish to npm using Trusted Publishing
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public --provenance --ignore-scripts
